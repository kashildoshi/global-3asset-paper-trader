name: Global 3-Asset Paper Trader (BTC-Gold-Silver)
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '*/15 * * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: nse-5sec-runner
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  trade-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_cycle.py